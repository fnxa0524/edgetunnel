name: Refresh public address pool

on:
  schedule:
    - cron: "22 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the current production Pages project to refresh
        run: |
          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 45 \
            --request POST \
            https://lzfnxa.us.ci/.well-known/address-pool/refresh
